<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLATE — The Living Atlas</title>
<style>
/* SLATE Phase 0 — atlas chrome. One committed visual world: aged
   parchment, walnut ink, gilded accents. The UI is the margin of the
   plate, not a dashboard. */

:root {
  --paper: #e8dcc0;
  --paper-hi: #f2ead6;
  --paper-panel: rgba(240, 231, 207, 0.94);
  --ink: #3a2f1e;
  --ink-faded: #6e5f42;
  --hairline: rgba(58, 47, 30, 0.35);
  --gold: #b08a2e;
  --gold-bright: #d4aa3c;
  --blood: #8a3b2a;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--serif);
  color: var(--ink);
  background: var(--paper);
  overflow: hidden;
}
#app { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }

button { font-family: var(--serif); color: var(--ink); }
:focus-visible { outline: 2px dashed var(--gold); outline-offset: 2px; }

/* ---------- panels share the plate-margin look ---------- */
.panelish {
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline), 0 2px 10px rgba(58, 47, 30, 0.18);
}

/* ---------- top bar ---------- */
#topbar {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 12px 16px; gap: 12px;
  pointer-events: none;
  z-index: 5;
}
#topbar > * { pointer-events: auto; }
.cartouche {
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline);
  padding: 7px 16px 8px;
  display: flex; align-items: baseline; gap: 10px;
}
.cartouche h1 {
  font-size: 19px; font-weight: 600;
  letter-spacing: 0.28em; text-transform: uppercase;
}
.cartouche .sub { font-size: 11.5px; font-style: italic; color: var(--ink-faded); white-space: nowrap; }
#date {
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline);
  padding: 7px 18px 8px;
  text-align: center; min-width: 170px;
}
#date-year { font-size: 17px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }
#date-season { font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-faded); }
#timectl {
  display: flex; align-items: center; gap: 8px;
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline);
  padding: 6px 10px;
}
.ctl {
  background: var(--paper-hi);
  border: 1px solid var(--ink);
  cursor: pointer;
  padding: 4px 9px;
  font-size: 12.5px;
  line-height: 1;
}
.ctl:hover { background: #fff7e0; }
.ctl.icon { width: 30px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.ctl.icon svg { width: 17px; height: 17px; }
.ctl.text { letter-spacing: 0.08em; }
.speeds { display: inline-flex; }
.speeds .speed { border-right-width: 0; min-width: 30px; height: 28px; font-weight: 600; }
.speeds .speed:last-child { border-right-width: 1px; }
.speed.active { background: var(--gold-bright); }
#btn-pause { min-width: 34px; }

/* ---------- powers rail ---------- */
#powers {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 12px;
  z-index: 5;
}
.seal {
  width: 58px; height: 58px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: var(--paper-panel);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline), 0 2px 8px rgba(58,47,30,0.22);
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px;
  transition: transform 0.12s ease;
}
.seal:hover { transform: scale(1.06); }
.seal svg { width: 22px; height: 22px; }
.seal-label { font-size: 7.5px; letter-spacing: 0.14em; text-transform: uppercase; }
.seal.active {
  border-color: var(--gold);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--gold), 0 0 0 3px rgba(176,138,46,0.35), 0 2px 8px rgba(58,47,30,0.22);
}

/* ---------- chronicle ledger ---------- */
#chronicle {
  position: absolute; top: 74px; right: 0; bottom: 0;
  width: 330px;
  display: flex; flex-direction: column;
  background: var(--paper-panel);
  border-left: 1px solid var(--ink);
  box-shadow: inset 3px 0 0 var(--paper-panel), inset 4px 0 0 var(--hairline);
  z-index: 4;
  transition: transform 0.25s ease;
}
#chronicle.collapsed { transform: translateX(296px); }
#chronicle.collapsed #btn-chron-toggle { transform: rotate(180deg); }
#chronicle header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--hairline);
}
#chronicle h2 {
  font-size: 12.5px; font-weight: 600;
  letter-spacing: 0.3em; text-transform: uppercase;
  flex: 1;
}
#chron-filter {
  font-family: var(--serif); font-size: 11.5px;
  background: var(--paper-hi); color: var(--ink);
  border: 1px solid var(--ink); padding: 2px 4px;
}
#btn-chron-toggle { font-size: 15px; transition: transform 0.25s ease; }
#chron-entries {
  list-style: none;
  overflow-y: auto; overflow-x: hidden;
  flex: 1;
  padding: 6px 0 20px;
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faded) transparent;
}
#chron-entries li {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 8px;
  padding: 6px 12px 6px 8px;
  border-bottom: 1px solid rgba(58, 47, 30, 0.14);
  cursor: pointer;
}
#chron-entries li:hover { background: rgba(176, 138, 46, 0.10); }
#chron-entries .yr {
  text-align: right;
  font-size: 11.5px; font-weight: 600;
  color: var(--ink-faded);
  font-variant-numeric: tabular-nums;
  padding-top: 1px;
}
#chron-entries p { font-size: 12.5px; line-height: 1.42; }
#chron-entries .tone-god { border-left: 3px solid var(--gold); }
#chron-entries .tone-god .yr, #chron-entries .tone-god p { color: #7c5f1c; }
#chron-entries .tone-doom { border-left: 3px solid var(--blood); }
#chron-entries .tone-doom p { color: #6d2f22; }
#chron-entries[data-min="2"] li[data-imp="1"] { display: none; }
#chron-entries[data-min="3"] li[data-imp="1"],
#chron-entries[data-min="3"] li[data-imp="2"] { display: none; }

/* ---------- legend ---------- */
#legend {
  position: absolute; left: 14px; bottom: 14px;
  width: 190px;
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline);
  z-index: 5;
  font-size: 12px;
}
#legend summary {
  cursor: pointer;
  padding: 7px 12px;
  font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase;
  user-select: none;
}
#legend-body { padding: 2px 12px 6px; }
.legend-row { display: flex; align-items: center; gap: 9px; padding: 2.5px 0; }
.legend-row span { color: var(--ink); font-size: 12px; }
#legend .hint {
  padding: 7px 12px 9px;
  border-top: 1px solid var(--hairline);
  font-size: 10.5px; font-style: italic; color: var(--ink-faded);
  line-height: 1.45;
}

/* ---------- tooltip & toast ---------- */
#tooltip {
  position: fixed; z-index: 9;
  max-width: 240px;
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: 0 3px 12px rgba(58,47,30,0.3);
  padding: 8px 11px 9px;
  pointer-events: none;
}
#tooltip h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 2px; }
#tooltip p { font-size: 11.5px; color: var(--ink-faded); line-height: 1.4; }
#tooltip em.f-gold { color: #7c5f1c; font-style: normal; font-weight: 600; }
#tooltip em.f-doom { color: var(--blood); font-style: normal; font-weight: 600; }
#tooltip em.f-god { color: var(--gold); font-style: normal; font-weight: 600; }
#toast {
  position: fixed; top: 84px; left: 50%; transform: translateX(-50%);
  z-index: 10;
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  box-shadow: inset 0 0 0 3px var(--paper-panel), inset 0 0 0 4px var(--hairline), 0 3px 12px rgba(58,47,30,0.3);
  padding: 9px 18px;
  font-size: 13px; font-style: italic;
}
#toast.tone-doom { color: var(--blood); }
#ffwd {
  position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
  z-index: 10;
  background: var(--paper-panel);
  border: 1px solid var(--ink);
  padding: 8px 16px;
  font-size: 13px; font-style: italic;
  font-variant-numeric: tabular-nums;
}

/* ---------- intro ---------- */
#intro {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(46, 37, 22, 0.5);
  display: grid; place-items: center;
  padding: 18px;
}
#intro .card {
  background: var(--paper);
  border: 1.5px solid var(--ink);
  box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6.5px var(--hairline), 0 14px 50px rgba(20, 14, 4, 0.5);
  max-width: 460px;
  padding: 30px 34px 28px;
  text-align: center;
}
#intro .over { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink-faded); margin-bottom: 12px; }
#intro h1 { font-size: 40px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 600; }
#intro .tag { font-style: italic; color: var(--ink-faded); margin: 2px 0 16px; }
#intro p { font-size: 13.5px; line-height: 1.55; margin-bottom: 10px; text-wrap: balance; }
#intro .row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 14px; }
#intro .seedrow label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faded); }
#intro input {
  font-family: var(--serif); font-size: 14px;
  width: 90px; text-align: center;
  background: var(--paper-hi); color: var(--ink);
  border: 1px solid var(--ink); padding: 4px 6px;
}
.big {
  border: 1.5px solid var(--ink);
  background: var(--paper-hi);
  padding: 9px 22px;
  font-size: 13.5px; letter-spacing: 0.1em;
  cursor: pointer;
}
.big:hover { background: #fff7e0; }
.big.primary { background: var(--gold-bright); font-weight: 600; }
.big.primary:hover { background: #e3bb4e; }

/* ---------- small screens ---------- */
@media (max-width: 880px) {
  .cartouche .sub { display: none; }
  #date { min-width: 120px; padding: 7px 10px 8px; }
  #chronicle { width: 300px; }
  #chronicle.collapsed { transform: translateX(266px); }
  #legend { width: 170px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
<div id="app">
  <canvas id="map"></canvas>
</div>
<script>
/* SLATE Phase 0 — deterministic seeded RNG streams.
   Every system pulls from its own labeled stream so systems can be
   added/removed without reshuffling everyone else's randomness. */
(function (S) {
  'use strict';

  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seed, label) {
    const fn = mulberry32(hashStr(String(seed) + '/' + label));
    return {
      next: fn,
      range: (a, b) => a + fn() * (b - a),
      int: (a, b) => a + Math.floor(fn() * (b - a + 1)),
      chance: (p) => fn() < p,
      pick: (arr) => arr[Math.floor(fn() * arr.length)],
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(fn() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
    };
  }

  // Stateless position hash in [0,1) — for per-cell visual jitter.
  function hash2(x, y, seed) {
    let n = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ (seed | 0);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  S.rng = { makeRng, hashStr, mulberry32, hash2 };
})(typeof SLATE !== 'undefined' ? SLATE : (globalThis.SLATE = {}));

</script>
<script>
/* SLATE Phase 0 — procedural naming: cultures, places, people, regions.
   Four founding cultures, each with its own phoneme flavor so the map
   reads as a world with distinct peoples, and separated colonies drift
   apart in sound. */
(function (S) {
  'use strict';

  S.CULTURES = [
    {
      id: 0, name: 'Aldish', color: '#55663B', demonym: 'the Aldish',
      starts: ['Ash', 'Thorn', 'Wex', 'Bram', 'Hart', 'Elm', 'Grim', 'Wether', 'Ryd', 'Col', 'Marl', 'Oat', 'Fenn', 'Bar'],
      ends: ['ford', 'stead', 'hollow', 'wick', 'bury', 'combe', 'field', 'mere', 'don', 'leigh', 'thorpe', 'bridge'],
      goldEnds: ['delve', 'hollow', 'wick', 'ford'],
      people: ['Osric', 'Aldwyn', 'Berta', 'Cedd', 'Godgifu', 'Hild', 'Leof', 'Wulfa', 'Eda', 'Sigred', 'Oswin', 'Merewen'],
    },
    {
      id: 1, name: 'Vasker', color: '#4A6274', demonym: 'the Vasker',
      starts: ['Skjal', 'Hrafn', 'Ulf', 'Gren', 'Kald', 'Bjor', 'Stein', 'Varg', 'Eld', 'Snor', 'Hval', 'Jarn'],
      ends: ['vik', 'heim', 'fjall', 'strand', 'nes', 'dal', 'holm', 'gard', 'foss', 'havn'],
      goldEnds: ['gruva', 'delv', 'heim', 'gard'],
      people: ['Ragna', 'Torvald', 'Sigrun', 'Eirik', 'Halla', 'Bjarke', 'Yrsa', 'Knut', 'Solveig', 'Orm', 'Astrid', 'Geir'],
    },
    {
      id: 2, name: 'Serai', color: '#A2652F', demonym: 'the Serai',
      starts: ['Al-Qas', 'Zafir', 'Mira', 'Sahl', 'Dar', 'Kal', 'Azar', 'Nur', 'Rasha', 'Tal', 'Zeyd', 'Har'],
      ends: ['ir', 'aba', 'oun', 'esh', 'ara', 'im', 'at', 'ez', 'ula', 'an'],
      goldEnds: ['-dhahab', 'ara', 'ir', 'esh'],
      people: ['Zahra', 'Idris', 'Layl', 'Basim', 'Naima', 'Tariq', 'Suheir', 'Omar', 'Yasmin', 'Khalid', 'Farah', 'Nadim'],
    },
    {
      id: 3, name: 'Tessian', color: '#6E4A5E', demonym: 'the Tessians',
      starts: ['Val', 'Cor', 'Aur', 'Sept', 'Mar', 'Luc', 'Tarr', 'Vin', 'Cael', 'Ost', 'Pell', 'Riv'],
      ends: ['ium', 'ora', 'essa', 'anum', 'ola', 'is', 'urnum', 'atia', 'ento', 'aris'],
      goldEnds: ['aurum', 'ora', 'ium'],
      people: ['Livia', 'Cassian', 'Aurel', 'Petra', 'Marcus', 'Octavia', 'Loran', 'Vitus', 'Sabina', 'Tullo', 'Camilla', 'Renz'],
    },
  ];

  const REGION_ADJ = ['Gray', 'Amber', 'Ashen', 'Whispering', 'Sundered', 'Elder', 'Silent', 'Golden', 'Thorn',
    'Mist', 'Winter', 'Red', 'Hollow', 'Storm', 'Far', 'Sleeping', 'Broken', 'Pale', 'Iron', 'Weeping'];
  const RANGE_END = ['Peaks', 'Spine', 'Crowns', 'Reach', 'Teeth', 'Fells', 'Wall'];
  const FOREST_END = ['Weald', 'Wood', 'Deepwood', 'Tangle', 'Wilds'];
  const SEA_END = ['Deep', 'Main', 'Expanse', 'Mirror', 'Gulf'];
  const DESERT_END = ['Waste', 'Sands', 'Reach'];
  const DRAGON_NAMES = ['Vharax', 'Skorn', 'Ymmeth', 'Cauldrax', 'Nyr', 'Vellumbra', 'Oroth', 'Kazmyre', 'Sarquel', 'Draumr'];

  function makeNamer(seed) {
    const rng = S.rng.makeRng(seed, 'names');
    const used = new Set();

    function unique(make) {
      for (let i = 0; i < 40; i++) {
        const n = make();
        if (!used.has(n)) { used.add(n); return n; }
      }
      // Give up on uniqueness gracefully rather than looping forever.
      const n = make() + ' ' + rng.int(2, 9);
      used.add(n);
      return n;
    }

    function joinName(a, b) {
      if (b.startsWith('-')) return a + b.slice(1);
      // Avoid awkward duplicate letters at the seam ("Thornnes" → "Thornes").
      if (a[a.length - 1] === b[0]) return a + b.slice(1);
      return a + b;
    }

    return {
      place(cultureId) {
        const c = S.CULTURES[cultureId];
        return unique(() => joinName(rng.pick(c.starts), rng.pick(c.ends)));
      },
      goldPlace(cultureId) {
        const c = S.CULTURES[cultureId];
        return unique(() => {
          if (rng.chance(0.5)) return joinName('Gold', rng.pick(c.goldEnds));
          return joinName(rng.pick(c.starts), rng.pick(c.goldEnds));
        });
      },
      person(cultureId) {
        return rng.pick(S.CULTURES[cultureId].people);
      },
      region(kind) {
        const adj = () => rng.pick(REGION_ADJ);
        return unique(() => {
          switch (kind) {
            case 'range': return 'The ' + adj() + ' ' + rng.pick(RANGE_END);
            case 'forest': return rng.chance(0.5) ? 'The ' + adj() + ' ' + rng.pick(FOREST_END) : adj() + rng.pick(['wood', 'weald']).toLowerCase();
            case 'sea': return 'The ' + adj() + ' ' + rng.pick(SEA_END);
            case 'ocean': return 'The ' + rng.pick(['Endless', 'Outer', 'Sunless', 'Wide']) + ' ' + rng.pick(['Ocean', 'Main']);
            case 'desert': return 'The ' + adj() + ' ' + rng.pick(DESERT_END);
            default: return 'The ' + adj() + ' Land';
          }
        });
      },
      dragon() {
        return rng.pick(DRAGON_NAMES);
      },
    };

  S.names = { makeNamer };

</script>
<script>
/* SLATE Phase 0 — deterministic world generation.
   Produces the geography a run lives on: continents, climate, biomes,
   rivers, fertility, resources, and named regions (ranges, forests,
   seas). Same seed → same world, always. */
(function (S) {
  'use strict';

  S.B = { OCEAN: 0, SHALLOW: 1, PLAINS: 2, FOREST: 3, HILLS: 4, MOUNTAIN: 5, DESERT: 6, SNOW: 7, MARSH: 8 };
  const B = S.B;

  const W = 192, H = 120;

  function valueNoise(seed) {
    function rnd(ix, iy) {
      let n = Math.imul(ix, 127413) ^ Math.imul(iy, 335545) ^ (seed | 0);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }
    const smooth = (t) => t * t * (3 - 2 * t);
    return function (x, y) {
      const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
      const a = rnd(ix, iy), b = rnd(ix + 1, iy), c = rnd(ix, iy + 1), d = rnd(ix + 1, iy + 1);
      const u = smooth(fx), v = smooth(fy);
      return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
    };
  }

  function fbm(noise, oct, lac, gain) {
    return (x, y) => {
      let s = 0, a = 1, f = 1, norm = 0;
      for (let i = 0; i < oct; i++) { s += a * noise(x * f, y * f); norm += a; a *= gain; f *= lac; }
      return s / norm;
    };
  }

  function generate(seed) {
    const hseed = S.rng.hashStr(String(seed));
    const nBase = fbm(valueNoise(hseed ^ 0x1111), 5, 2.0, 0.5);
    const nWarp = fbm(valueNoise(hseed ^ 0x2222), 4, 2.0, 0.5);
    const nRidge = fbm(valueNoise(hseed ^ 0x3333), 4, 2.1, 0.5);
    const nMoist = fbm(valueNoise(hseed ^ 0x4444), 4, 2.0, 0.5);
    const nJit = valueNoise(hseed ^ 0x5555);
    const rng = S.rng.makeRng(seed, 'worldgen');
    const namer = S.names.makeNamer(seed);

    const N = W * H;
    const height = new Float32Array(N);
    const temp = new Float32Array(N);
    const moist = new Float32Array(N);
    const fertBase = new Float32Array(N);
    const fert = new Float32Array(N);
    const biome = new Uint8Array(N);
    const river = new Uint8Array(N);
    const resource = new Uint8Array(N);
    const seaDist = new Uint8Array(N);   // land: distance to nearest water (capped)
    const landDist = new Uint8Array(N);  // water: distance to nearest land (capped)
    const regionOf = new Int16Array(N).fill(-1);
    const idx = (x, y) => y * W + x;

    // --- Height field: warped fBm + ridged component, ocean frame at map edges.
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const u = x / W * 7, v = y / H * 4.4;
        const wx = u + (nWarp(u * 0.9 + 40, v * 0.9) - 0.5) * 1.6;
        const wy = v + (nWarp(u * 0.9, v * 0.9 + 40) - 0.5) * 1.6;
        let h = nBase(wx, wy) * 0.72;
        const r = nRidge(u * 1.15 + 9, v * 1.15 + 9);
        const ridge = Math.pow(1 - Math.abs(2 * r - 1), 2.2);
        h += ridge * 0.34;
        const ex = Math.min(x, W - 1 - x) / 14, ey = Math.min(y, H - 1 - y) / 12;
        const edge = Math.min(1, Math.min(ex, ey));
        h *= 0.35 + 0.65 * (edge < 1 ? edge * edge * (3 - 2 * edge) : 1);
        height[idx(x, y)] = h;
      }
    }

    // --- Sea level: binary search to a fixed land fraction (keeps every seed usable).
    const LAND_TARGET = 0.36;
    let lo = 0.1, hi = 0.9, sea = 0.5;
    for (let it = 0; it < 22; it++) {
      sea = (lo + hi) / 2;
      let land = 0;
      for (let i = 0; i < N; i++) if (height[i] > sea) land++;
      if (land / N > LAND_TARGET) lo = sea; else hi = sea;
    }
    const isWater = (i) => height[i] <= sea;

    // --- Distance fields (BFS), for climate, shallows and depth shading.
    {
      const q = [];
      seaDist.fill(255); landDist.fill(255);
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (isWater(i)) {
          let coast = false;
          if (x > 0 && !isWater(i - 1)) coast = true;
          if (x < W - 1 && !isWater(i + 1)) coast = true;
          if (y > 0 && !isWater(i - W)) coast = true;
          if (y < H - 1 && !isWater(i + W)) coast = true;
          landDist[i] = coast ? 1 : 255;
          if (coast) q.push(i);
        } else {
          let shore = false;
          if (x > 0 && isWater(i - 1)) shore = true;
          if (x < W - 1 && isWater(i + 1)) shore = true;
          if (y > 0 && isWater(i - W)) shore = true;
          if (y < H - 1 && isWater(i + W)) shore = true;
          seaDist[i] = shore ? 1 : 255;
          if (shore) q.push(i);
        }
      }
      let head = 0;
      while (head < q.length) {
        const i = q[head++];
        const x = i % W, y = (i / W) | 0;
        const field = isWater(i) ? landDist : seaDist;
        const d = field[i];
        if (d >= 30) continue;
        const push = (j) => {
          if (isWater(j) !== isWater(i)) return;
          const f = isWater(j) ? landDist : seaDist;
          if (f[j] > d + 1) { f[j] = d + 1; q.push(j); }
        };
        if (x > 0) push(i - 1);
        if (x < W - 1) push(i + 1);

        const coastal = Math.max(0, 1 - Math.min(seaDist[i], 30) / 26);

    }

    const riverPaths = [];
    {
      const springs = [];

        const i = idx(x, y);

      }

      const chosen = [];
      for (const s of springs) {
        if (chosen.length >= 30) break;
        if (chosen.every((c) => (c[0] - s[0]) ** 2 + (c[1] - s[1]) ** 2 >= 49)) chosen.push(s);

      for (const [sx, sy] of chosen) {

        const visited = new Set([idx(x, y)]);
        let merged = false;
        for (let step = 0; step < 500; step++) {
          let bx = -1, by = -1, bh = Infinity;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
            const j = idx(nx, ny);
            if (visited.has(j)) continue;
            const hh = height[j] + (S.rng.hash2(nx, ny, hseed) - 0.5) * 0.02;
            if (hh < bh) { bh = hh; bx = nx; by = ny; }
          }
          if (bx < 0 || bh > height[idx(x, y)] + 0.015) break; // stuck in a pit
          x = bx; y = by;
          const j = idx(x, y);
          pts.push([x, y]);
          if (isWater(j)) break;
          if (river[j]) { river[j] = Math.min(3, river[j] + 1); merged = true; break; }
          visited.add(j);
        }
        if (pts.length >= 7) {
          for (const [px, py] of pts) {
            const j = idx(px, py);
            if (!isWater(j)) river[j] = Math.max(river[j], 1);
          }
          riverPaths.push({ pts, flow: merged ? 2 : 1 });
        }
      }
    }

    // --- Biomes.
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (isWater(i)) { biome[i] = landDist[i] <= 2 ? B.SHALLOW : B.OCEAN; continue; }
        const h = height[i], t = temp[i], m = moist[i];
        if (h > sea + 0.30) biome[i] = B.MOUNTAIN;
        else if (t < 0.18) biome[i] = B.SNOW;
        else if (h > sea + 0.20) biome[i] = B.HILLS;
        else if (t > 0.72 && m < 0.34) biome[i] = B.DESERT;
        else if (m > 0.78 && h < sea + 0.08 && t > 0.3) biome[i] = B.MARSH;
        else if (m > 0.5 && t > 0.26) biome[i] = B.FOREST;
        else biome[i] = B.PLAINS;
      }
    }

    // --- Fertility & natural resources.
    const FERT_BY_BIOME = { [B.PLAINS]: 0.75, [B.FOREST]: 0.55, [B.HILLS]: 0.42, [B.MARSH]: 0.5, [B.DESERT]: 0.07, [B.SNOW]: 0.05, [B.MOUNTAIN]: 0.1 };
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (isWater(i)) { fertBase[i] = 0; continue; }
        let f = FERT_BY_BIOME[biome[i]] || 0.3;
        let nearRiver = river[i] > 0;
        if (!nearRiver) {
          if (x > 0 && river[i - 1]) nearRiver = true;
          else if (x < W - 1 && river[i + 1]) nearRiver = true;
          else if (y > 0 && river[i - W]) nearRiver = true;
          else if (y < H - 1 && river[i + W]) nearRiver = true;
        }
        if (nearRiver) f += 0.28;
        f += (S.rng.hash2(x, y, hseed ^ 0x77) - 0.5) * 0.14;
        fertBase[i] = Math.max(0, Math.min(1.2, f));

    // --- Hidden natural gold veins.
    const veins = [];
    {
      const cand = [];
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = idx(x, y);
        if (biome[i] === B.MOUNTAIN || biome[i] === B.HILLS) cand.push([x, y]);
      }
      const shuffled = rng.shuffle(cand);
      for (const [x, y] of shuffled) {
        if (veins.length >= 10) break;
        if (veins.every((v) => (v.x - x) ** 2 + (v.y - y) ** 2 >= 100)) {
          veins.push({ x, y, revealed: false, divine: false });
        }
      }
    }

    // --- Named regions (flood fills).
    const regions = [];
    {
      const seen = new Uint8Array(N);
      const MIN_SIZE = { range: 14, forest: 40, desert: 50 };
      const KIND_OF = { [B.MOUNTAIN]: 'range', [B.FOREST]: 'forest', [B.DESERT]: 'desert' };
      function flood(start, match) {
        const cells = [start];
        seen[start] = 1;
        for (let h2 = 0; h2 < cells.length; h2++) {
          const i = cells[h2];
          const x = i % W, y = (i / W) | 0;
          const tryPush = (j) => { if (!seen[j] && match(j)) { seen[j] = 1; cells.push(j); } };
          if (x > 0) tryPush(i - 1);
          if (x < W - 1) tryPush(i + 1);
          if (y > 0) tryPush(i - W);
          if (y < H - 1) tryPush(i + W);
        }
        return cells;
      }
      function registerRegion(cells, kind) {
        let cx = 0, cy = 0;
        for (const i of cells) { cx += i % W; cy += (i / W) | 0; }
        cx /= cells.length; cy /= cells.length;
        // Anchor the label on a member cell nearest the centroid.
        let best = cells[0], bd = Infinity;
        for (const i of cells) {
          const d = ((i % W) - cx) ** 2 + (((i / W) | 0) - cy) ** 2;
          if (d < bd) { bd = d; best = i; }
        }
        const id = regions.length;
        for (const i of cells) regionOf[i] = id;
        regions.push({ id, kind, name: namer.region(kind), cx: best % W, cy: (best / W) | 0, size: cells.length });
      }
      for (let i = 0; i < N; i++) {
        if (seen[i] || isWater(i)) continue;
        const kind = KIND_OF[biome[i]];
        if (!kind) { seen[i] = 1; continue; }
        const cells = flood(i, (j) => biome[j] === biome[i]);
        if (cells.length >= MIN_SIZE[kind]) registerRegion(cells, kind);
      }
      // Water bodies: the largest is the ocean; other big ones are seas.
      const bodies = [];
      for (let i = 0; i < N; i++) {
        if (seen[i] || !isWater(i)) continue;
        bodies.push(flood(i, (j) => isWater(j)));
      }
      bodies.sort((a, b) => b.length - a.length);
      bodies.forEach((cells, k) => {
        if (k === 0) registerRegion(cells, 'ocean');
        else if (cells.length >= 160) registerRegion(cells, 'sea');

    }

    // --- Culture homelands: 4 fertile coastal sites, far apart.
    const homelands = [];
    {
      const cand = [];
      for (let y = 3; y < H - 3; y++) for (let x = 3; x < W - 3; x++) {
        const i = idx(x, y);
        if (isWater(i) || seaDist[i] > 2 || temp[i] < 0.24) continue;
        let f = 0;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
          f += fertBase[idx(nx, ny)];
        }
        if (f > 8) cand.push({ x, y, f });
      }
      cand.sort((a, b) => b.f - a.f);
      const top = cand.slice(0, 400);
      if (top.length) {
        homelands.push(top[0]);
        while (homelands.length < 4 && top.length) {
          let best = null, bestD = -1;
          for (const c of top) {
            let dmin = Infinity;
            for (const hpt of homelands) dmin = Math.min(dmin, (hpt.x - c.x) ** 2 + (hpt.y - c.y) ** 2);
            const score = dmin + c.f * 4;
            if (dmin > 120 && score > bestD) { bestD = score; best = c; }
          }
          if (!best) break;
          homelands.push(best);
        }
      }
    }

    return {
      seed, W, H, sea, idx,
      height, temp, moist, fertBase, fert, biome, river, resource,
      seaDist, landDist, regionOf, regions, riverPaths, veins, homelands,
      namer,
      isWater: (x, y) => height[idx(x, y)] <= sea,

  }

<script>
/* SLATE Phase 0 — the Chronicle: an append-only log of everything that
   happens, with prose templates. This is the seed of the event-sourcing
   architecture from the design bible: the sim emits facts, the chronicle
   renders them as history. */
(function (S) {
  'use strict';

  // importance: 1 minor, 2 notable, 3 major. tone: 'plain' | 'god' | 'doom'.
  const T = {
    landing: (w, d) => [2, 'plain', `${S.CULTURES[d.culture].demonym} come ashore; ${d.name} is raised where the boats were drawn up.`],
    found: (w, d) => [1, 'plain', `${d.name} founded by settlers out of ${d.parent}.`],
    camp: (w, d) => [2, 'plain', `A mining camp takes root beneath ${d.region}; they call it ${d.name}.`],
    village: (w, d) => [1, 'plain', `${d.name} grows into a proper village.`],
    town: (w, d) => [2, 'plain', `${d.name} raises walls — a town of some ${d.pop} souls.`],
    city: (w, d) => [3, 'plain', `${d.name} is now a city, greatest of ${S.CULTURES[d.culture].demonym}' holdings.`],
    goldSeed: (w, d) => [3, 'god', `A vein of gold blooms in the stone of ${d.region}. The mountain did not hold it yesterday.`],
    goldFound: (w, d) => [2, 'plain', `Prospectors strike gold near ${d.name}. Hungry men arrive within the season.`],
    boom: (w, d) => [2, 'plain', `${d.name} swells with fortune-seekers and grows rich on the diggings.`],
    famine: (w, d) => [2, 'plain', `Lean years strike ${d.name}; the granaries echo.`],
    abandon: (w, d) => [d.tier >= 2 ? 3 : 2, 'plain', `${d.name} stands empty${d.why ? ' — ' + d.why : ''}. The roads grow over.`],
    curse: (w, d) => [3, 'god', `The skies over ${d.place} turn against the living. The storm does not pass. The priests say something is angry.`],
    stormExodus: (w, d) => [2, 'doom', `The people of ${d.name} abandon their homes to the endless storm.`],
    bless: (w, d) => [3, 'god', `A gentleness settles on the land near ${d.place}; seeds take root wherever they fall. Shrines appear by the field-edges.`],
    dragon: (w, d) => [3, 'doom', `A wyrm has nested in ${d.region}. They name it ${d.dragon}. Its shadow falls across ${d.name}.`],
    raid: (w, d) => [2, 'doom', `${d.dragon} descends upon ${d.name}; the granaries burn.`],
    razed: (w, d) => [3, 'doom', `${d.name} is no more. Men will call that place ${d.ruinName}.`],
    slain: (w, d) => [3, 'plain', `${d.hero} of ${d.name} slays ${d.dragon} in ${d.region}. The hoard comes down the mountain in carts.`],
    dragonGone: (w, d) => [2, 'plain', `${d.dragon}, finding nothing left worth coveting, flies beyond the map's edge.`],
    road: (w, d) => [1, 'plain', `A road now runs between ${d.a} and ${d.b}.`],
    migration: (w, d) => [1, 'plain', `Refugees out of ${d.from} settle in ${d.to}.`],
  };

  function create() {
    return { events: [], nextId: 1 };
  }

  function add(world, type, data) {
    const tpl = T[type];
    if (!tpl) throw new Error('unknown chronicle type: ' + type);
    const [imp, tone, text] = tpl(world, data);
    const e = {
      id: world.chronicle.nextId++,
      type, imp, tone, text,
      year: world.year, month: world.month,
      x: data.x, y: data.y,
    };
    world.chronicle.events.push(e);
    if (world.onEvent) world.onEvent(e);
    return e;
  }

  function toMarkdown(world) {
    const lines = [];
    lines.push(`# The Chronicle of ${world.title || 'an Unnamed World'}`);
    lines.push('');
    lines.push(`*World seed \`${world.seed}\` · years 0–${world.year} · set down by no mortal hand.*`);
    lines.push('');
    let century = -1;
    let lastYear = -1;
    for (const e of world.chronicle.events) {
      const c = Math.floor(e.year / 100);
      if (c !== century) {
        century = c;
        lines.push(`## Years ${c * 100}–${c * 100 + 99}`);
        lines.push('');
      }
      const yearLabel = e.year === lastYear ? '     ' : String(e.year).padStart(5, ' ');
      lastYear = e.year;
      const mark = e.tone === 'god' ? ' ✦' : e.tone === 'doom' ? ' †' : '';
      lines.push(`- **Year ${e.year}**${mark} — ${e.text}`);
    }
    lines.push('');
    lines.push('---');
    const alive = world.settlements.filter((s) => !s.ruined);
    lines.push(`*As of Year ${world.year}: ${alive.length} living settlements, ` +
      `${world.ruins.length} ruins, ${world.chronicle.events.length} recorded events.*`);
    return lines.join('\n');
  }

  S.chronicle = { create, add, toMarkdown };
})(typeof SLATE !== 'undefined' ? SLATE : (globalThis.SLATE = {}));

<script>
/* SLATE Phase 0 — world state container + shared queries.
   Wraps the generated geography with runtime state (settlements, storms,
   dragons, roads, chronicle) and the helper functions every system uses. */
(function (S) {
  'use strict';
  const B = () => S.B;

  const MONTHS = ['Thaw', 'Seedtime', 'Bloom', 'Highsun', 'Longsun', 'Harvest',
    'Gleaning', 'Mistfall', 'Frostgate', 'Deepwinter', 'Icewane', 'Stirring'];
  const TIER_NAMES = ['hamlet', 'village', 'town', 'city'];
  const TIER_POP = [0, 450, 1300, 3200];
  const RUIN_NAMES = ['Dragonfall', 'Wyrmscar', 'Ashmark', 'Cinderrest'];

  function create(seed) {
    const w = S.worldgen.generate(seed);
    w.settlements = [];
    w.ruins = [];        // {x,y,name,year,tier,cause}
    w.storms = [];       // {x,y,r}
    w.blesses = [];      // {x,y,r}
    w.dragons = [];      // {name,x,y,bornYear,lastRaid,raidEvery,regionName}
    w.deadLairs = [];
    w.roads = [];        // {a,b,pts}
    w.roadDeg = {};      // settlement id -> degree
    w.claims = new Int16Array(w.W * w.H).fill(-1);
    w.settleGrid = new Int16Array(w.W * w.H).fill(-1); // cell -> alive settlement id
    w.settlementsById = [];
    w.tick = 0; w.month = 0; w.year = 0;
    w.chronicle = S.chronicle.create();

    w.nextSettlementId = 1;
    w.leanYears = 0;
    w.fertDirty = false;

    w.title = 'Seed ' + seed;

    attachHelpers(w);

    // Founding landings: each culture puts two hamlets ashore near its homeland.
    w.homelands.forEach((h, ci) => {
      if (ci >= S.CULTURES.length) return;

      if (!first) return;
      const a = w.addSettlement({ x: first.x, y: first.y, culture: ci, pop: w.rngSim.int(90, 150) });
      S.chronicle.add(w, 'landing', { culture: ci, name: a.name, x: a.x, y: a.y });
      const second = w.bestSiteNear(h.x, h.y, 3, 8);
      if (second) {
        const b2 = w.addSettlement({ x: second.x, y: second.y, culture: ci, pop: w.rngSim.int(60, 110) });
        S.chronicle.add(w, 'found', { name: b2.name, parent: a.name, x: b2.x, y: b2.y });

  }

    w.tierOf = (pop) => pop >= TIER_POP[3] ? 3 : pop >= TIER_POP[2] ? 2 : pop >= TIER_POP[1] ? 1 : 0;

    w.fertAround = (x, y, r) => {

      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {

      // the vein; if the range is solid stone, they camp on the stone itself.

        if (!w.inB(nx, ny) || !w.isLandAt(nx, ny)) continue;
        if (w.settlementNear(nx, ny, 2.5) || w.stormAt(nx, ny)) continue;
        const b = w.biome[idx(nx, ny)];
        const d = Math.sqrt(dx * dx + dy * dy);
        if (b === S.B.MOUNTAIN || b === S.B.SNOW) {
          if (!fallback && d <= 2) fallback = { x: nx, y: ny };
          continue;
        }
        const sc = w.fertAround(nx, ny, 1) - d * 0.3;

      let best = null, bd = Infinity;

        if (!w.inB(nx, ny) || w.biome[idx(nx, ny)] !== S.B.MOUNTAIN) continue;

          const nx = x + dx, ny = y + dy;

          const rr = w.regionOf[idx(nx, ny)];
          if (rr >= 0 && w.regions[rr].kind !== 'ocean' && w.regions[rr].kind !== 'sea') return w.regions[rr].name;
        }

    w.addSettlement = ({ x, y, culture, pop, name, gold }) => {

      w.ruins.push({ x: s.x, y: s.y, name: s.name, year: w.year, tier: s.tier, cause, alt });
      w.dirty.features = true; w.dirty.borders = true; w.dirty.labels = true;

    w.recomputeClaims = () => {

<script>
/* SLATE Phase 0 — the simulation tick. One tick = one month.
   Order is fixed and deterministic: climate → settlements → colonization
   → gold → dragons → roads → claims. The world runs with zero divine
   input; god powers only perturb it. */
(function (S) {
  'use strict';

  const FEAR_R = 8;      // dragon terror radius
  const RAID_R = 10;

  function tick(w) {
    const rng = w.rngSim;
    w.tick++;
    w.month = w.tick % 12;
    w.year = Math.floor(w.tick / 12);

    if (w.month === 0) yearly(w, rng);

    // --- Per-settlement dragon fear cache (cheap: few dragons).
    const feared = new Set();
    for (const d of w.dragons) {
      for (const s of w.settlements) {
        if (s.ruined) continue;
        if ((s.x - d.x) ** 2 + (s.y - d.y) ** 2 <= FEAR_R * FEAR_R) feared.add(s.id);
      }
    }

    // --- Settlements.
    for (const s of w.settlements) {
      if (s.ruined) continue;
      const storm = w.stormAt(s.x, s.y);

      // Food capacity: staggered recompute, or forced when fertility changed.
      const deg = w.roadDeg[s.id] || 0;
      const boom = w.tick < s.boomUntil;
      s.prosp = 1 + 0.15 * deg + (s.gold ? 2.5 : 0) + (s.fish ? 0.3 : 0) + s.tier * 0.15 + (boom ? 1 : 0);

      if (w.fertDirty || (w.tick + s.id) % 24 === 0) {
        let cap = w.fertAround(s.x, s.y, 3) * 26;
        if (s.fish && !storm) cap += 170;
        cap *= 1 + 0.7 * Math.max(0, s.prosp - 1); // trade feeds cities beyond what fields carry
        if (w.leanYears > 0) cap *= 0.85;
        s.cap = Math.max(25, cap);
      }

      const prev = s.pop;
      if (storm) {
        s.pop *= 0.972; // the sky itself is against them
      } else {
        let r = 0.011 * (0.75 + 0.25 * Math.min(2.2, s.prosp));
        if (boom) r *= 1.6;
        if (feared.has(s.id)) r *= 0.25;
        s.pop += s.pop * r * (1 - s.pop / s.cap);
      }

      s.declineStreak = s.pop < prev - 0.01 ? s.declineStreak + 1 : 0;

      // Hunger and famine: chronicled only when the deficit is deep and rare.
      if (s.pop > s.cap * 1.2) {
        s.hungerStreak++;
        if (s.hungerStreak >= 15 && s.pop > 250 && w.year - s.lastFamineYear > 15) {
          s.lastFamineYear = w.year;
          s.hungerStreak = 0;
          S.chronicle.add(w, 'famine', { name: s.name, x: s.x, y: s.y });
          s.pop *= 0.82;
          const dest = bestNeighbor(w, s);
          if (dest) { dest.pop += s.pop * 0.06; s.pop *= 0.94; }
        }
      } else if (s.hungerStreak > 0) s.hungerStreak = Math.max(0, s.hungerStreak - 2);

      // Tier transitions: chronicled only the first time a rank is reached.
      const t = w.tierOf(s.pop);
      if (t > s.tier) {
        s.tier = t;
        if (t > s.maxTier) {
          s.maxTier = t;
          const data = { name: s.name, pop: Math.round(s.pop / 50) * 50, culture: s.culture, x: s.x, y: s.y };
          S.chronicle.add(w, t === 1 ? 'village' : t === 2 ? 'town' : 'city', data);
        }
        w.dirty.features = w.dirty.borders = w.dirty.labels = true;
      } else if (t < s.tier) {
        s.tier = t; // quiet decline; the chronicle notices only the fall to ruin
        w.dirty.features = w.dirty.labels = true;
      }

      // Abandonment.
      if ((s.pop < 35 && s.declineStreak > 24) || (storm && s.pop < 55)) {
        const why = storm ? null : (feared.has(s.id) ? 'its people fled the wyrm' : null);
        if (storm) S.chronicle.add(w, 'stormExodus', { name: s.name, x: s.x, y: s.y });
        else S.chronicle.add(w, 'abandon', { name: s.name, tier: s.tier, why, x: s.x, y: s.y });
        w.ruinSettlement(s, storm ? 'storm' : 'decline');
        const dest = bestNeighbor(w, s);
        if (dest) {
          dest.pop += s.pop * 0.6;
          S.chronicle.add(w, 'migration', { from: s.name, to: dest.name, x: dest.x, y: dest.y, fx: s.x, fy: s.y });
        }
        continue;
      }

      // Wealth accrues from prosperity; this is what dragons smell.
      s.wealth += s.prosp * s.pop / 200000;
    }
    w.fertDirty = false;

    // --- Colonization (fission), damped by regional crowding.
    const aliveNow = w.aliveSettlements();
    for (const s of aliveNow) {
      if (s.pop > s.cap * 0.7 && s.pop > 150 && rng.chance(0.005)) {
        let crowd = 0;
        for (const o of aliveNow) {
          if ((o.x - s.x) ** 2 + (o.y - s.y) ** 2 <= 64) crowd++;
        }
        if (rng.next() < (crowd - 2) / 10) continue; // packed regions stop spilling outward
        const site = w.bestSiteNear(s.x, s.y, 5, 16);
        if (site) {
          const emig = Math.max(40, s.pop * 0.28);
          s.pop -= emig * 0.9;
          const child = w.addSettlement({ x: site.x, y: site.y, culture: s.culture, pop: emig });
          S.chronicle.add(w, 'found', { name: child.name, parent: s.name, x: child.x, y: child.y, fx: s.x, fy: s.y });
        }
      }
    }

    // --- Gold: discovery near settlements, mining camps in the wilds.
    for (const v of w.veins) {
      if (!v.revealed) {
        const near = w.settlementNear(v.x, v.y, 4.5);
        if (near && rng.chance(0.02)) {
          v.revealed = true;
          near.gold = true;
          near.boomUntil = w.tick + 40 * 12;
          S.chronicle.add(w, 'goldFound', { name: near.name, x: v.x, y: v.y });
          S.chronicle.add(w, 'boom', { name: near.name, x: near.x, y: near.y });
          pullMigrants(w, near, 0.12);
          w.dirty.features = true;
        }
      } else if (!w.settlementNear(v.x, v.y, 4)) {
        // A known vein with nobody working it draws the desperate.
        const parent = w.settlementNear(v.x, v.y, 16);
        const chance = parent ? 0.012 : 0.004;
        if (rng.chance(chance)) {
          const spot = w.campSiteNear(v.x, v.y);
          if (spot) {
            const culture = parent ? parent.culture : (w.settlementNear(v.x, v.y, 60) || { culture: rng.int(0, S.CULTURES.length - 1) }).culture;
            const name = w.namer.goldPlace(culture);
            const camp = w.addSettlement({ x: spot.x, y: spot.y, culture, pop: parent ? 55 : 40, name, gold: true });
            camp.boomUntil = w.tick + 40 * 12;
            S.chronicle.add(w, 'camp', { name, region: w.regionNameAt(v.x, v.y, 'the high stone'), x: spot.x, y: spot.y });
            if (parent) { parent.pop *= 0.96; }
          }
        }
      }
    }

    // --- Dragons: raids.
    for (const d of w.dragons.slice()) {
      if (w.tick - d.lastRaid > d.raidEvery) {
        let target = null, tw = 8; // only bother with somewhere worth burning
        for (const s of w.aliveSettlements()) {
          if ((s.x - d.x) ** 2 + (s.y - d.y) ** 2 <= RAID_R * RAID_R && s.wealth + s.pop / 400 > tw) {
            tw = s.wealth + s.pop / 400; target = s;
          }
        }
        d.lastRaid = w.tick;
        d.raidEvery = rng.int(60, 140);
        if (target) {
          S.chronicle.add(w, 'raid', { dragon: d.name, name: target.name, x: target.x, y: target.y, fx: d.x, fy: d.y });
          target.pop *= 0.85;
          target.wealth *= 0.75;
          if (target.pop < 400 && rng.chance(0.5)) {
            const alt = w.ruinSettlement(target, 'dragon', true);
            S.chronicle.add(w, 'razed', { name: target.name, ruinName: alt, x: target.x, y: target.y });
            const dest = bestNeighbor(w, target);
            if (dest) {
              dest.pop += target.pop * 0.5;
              S.chronicle.add(w, 'migration', { from: target.name, to: dest.name, x: dest.x, y: dest.y, fx: target.x, fy: target.y });
            }
          }
        }

      w.recomputeClaims();

      w.claimsDirtyTick = w.tick;
    }
  }

  function yearly(w, rng) {
    // Lean years: a world-scale harvest cycle.
    if (w.leanYears > 0) w.leanYears--;
    else if (rng.chance(0.10)) w.leanYears = rng.int(1, 2);

    // Dragon spawning: wealth near mountains breeds trouble.
    if (w.dragons.length < 2 && w.year >= 60 && w.tick >= (w.dragonCooldownUntil || 0)) {
      for (const s of w.aliveSettlements()) {
        if (s.wealth < 70) continue;
        const m = w.nearestMountain(s.x, s.y, 6);
        if (!m) continue;
        if (rng.chance(Math.min(0.05, 0.015 + s.wealth / 4000))) {
          const d = {
            name: 'the wyrm ' + w.namer.dragon(),
            x: m.x, y: m.y, bornYear: w.year,
            lastRaid: w.tick, raidEvery: rng.int(48, 110),
            regionName: w.regionNameAt(m.x, m.y, 'the high peaks'),
          };
          w.dragons.push(d);
          S.chronicle.add(w, 'dragon', { dragon: d.name, region: d.regionName, name: s.name, x: m.x, y: m.y });
          w.dirty.features = true;
          break;
        }
      }
    }

    // Dragon slaying & departure.
    for (const d of w.dragons.slice()) {
      const heroes = w.aliveSettlements().filter((s) => s.tier >= 2 && (s.x - d.x) ** 2 + (s.y - d.y) ** 2 <= RAID_R * RAID_R);
      const anyNear = w.settlementNear(d.x, d.y, 12);
      if (heroes.length && rng.chance(0.10)) {
        const home = rng.pick(heroes);
        const hero = 'Ser ' + w.namer.person(home.culture) + ' the Wyrmslayer';
        S.chronicle.add(w, 'slain', { hero, name: home.name, dragon: d.name, region: d.regionName, x: d.x, y: d.y });
        home.wealth += 35;
        home.boomUntil = Math.max(home.boomUntil, w.tick + 10 * 12);
        w.dragons.splice(w.dragons.indexOf(d), 1);
        w.deadLairs.push({ x: d.x, y: d.y });
        w.dragonCooldownUntil = w.tick + 300; // a generation of peace
        w.dirty.features = true;
      } else if (!anyNear && rng.chance(0.3)) {
        S.chronicle.add(w, 'dragonGone', { dragon: d.name, x: d.x, y: d.y });
        w.dragons.splice(w.dragons.indexOf(d), 1);
        w.deadLairs.push({ x: d.x, y: d.y });
        w.dragonCooldownUntil = w.tick + 300;
        w.dirty.features = true;
      }
    }

    // Roads: nearby sizable settlements link up.
    let built = 0;
    const alive = w.aliveSettlements().filter((s) => s.tier >= 1);
    for (let i = 0; i < alive.length && built < 2; i++) {
      for (let j = i + 1; j < alive.length && built < 2; j++) {
        const a = alive[i], b = alive[j];
        const d2 = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (d2 > 13 * 13) continue;
        if ((w.roadDeg[a.id] || 0) >= 4 || (w.roadDeg[b.id] || 0) >= 4) continue;
        if (w.roads.some((r) => (r.a === a.id && r.b === b.id) || (r.a === b.id && r.b === a.id))) continue;
        if (!rng.chance(0.25)) continue;
        const pts = roadPath(w, a, b);
        if (!pts) continue;
        w.roads.push({ a: a.id, b: b.id, pts });
        w.roadDeg[a.id] = (w.roadDeg[a.id] || 0) + 1;
        w.roadDeg[b.id] = (w.roadDeg[b.id] || 0) + 1;
        S.chronicle.add(w, 'road', { a: a.name, b: b.name, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        w.dirty.features = true;
        built++;
      }
    }
  }

  function roadPath(w, a, b) {
    // Sampled straight-ish path; reject if it wades through open water.
    const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) * 2);
    const pts = [];
    let wet = 0;
    for (let k = 0; k <= steps; k++) {
      const t = k / steps;
      const x = a.x + (b.x - a.x) * t;
      const y = a.y + (b.y - a.y) * t;
      if (!w.isLandAt(Math.round(x), Math.round(y))) wet++;
      if (wet > 1) return null;
      pts.push([x, y]);
    }
    return pts;
  }

  function bestNeighbor(w, s) {
    let best = null, bd = Infinity;
    for (const o of w.settlements) {
      if (o.ruined || o === s) continue;
      if (w.stormAt(o.x, o.y)) continue;
      const d2 = (o.x - s.x) ** 2 + (o.y - s.y) ** 2;
      if (d2 < bd) { bd = d2; best = o; }
    }
    return best;
  }

  function pullMigrants(w, target, frac) {
    const near = w.aliveSettlements()
      .filter((s) => s !== target && (s.x - target.x) ** 2 + (s.y - target.y) ** 2 < 400)
      .sort((a, b2) => b2.pop - a.pop)
      .slice(0, 2);
    for (const s of near) {
      const moved = s.pop * frac * 0.5;
      s.pop -= moved;
      target.pop += moved;
    }
  }

  function runYears(w, years, onYear) {
    for (let i = 0; i < years * 12; i++) {
      tick(w);
      if (onYear && w.tick % 12 === 0) onYear(w);
    }
  }

  S.sim = { tick, runYears };

/* SLATE Phase 0 — acts of god. Three powers, each a perturbation the

    if (!w.inB(x, y)) return { ok: false, msg: 'Beyond the edge of the map.' };
    const b = w.biome[w.idx(x, y)];
    if (b !== S.B.MOUNTAIN && b !== S.B.HILLS) {
      return { ok: false, msg: 'The vein must be seeded in high stone — choose mountains or hills.' };
    }
    const v = { x, y, revealed: true, divine: true };
    w.veins.push(v);
    S.chronicle.add(w, 'goldSeed', { region: w.regionNameAt(x, y, 'the high stone'), x, y });

    for (let dy = -3; dy <= 3 && !anyLand; dy++) for (let dx = -3; dx <= 3 && !anyLand; dx++) {
      if (w.isLandAt(x + dx, y + dy)) anyLand = true;
    }

    S.chronicle.add(w, 'curse', { place: near ? near.name : w.regionNameAt(x, y, 'the open country'), x, y });
    w.dirty.features = true;
    return { ok: true, x, y };
  }

    x = Math.round(x); y = Math.round(y);
    if (!w.inB(x, y)) return { ok: false, msg: 'Beyond the edge of the map.' };
    if (!w.isLandAt(x, y)) return { ok: false, msg: 'Bless the soil, not the sea.' };
    if (w.stormAt(x, y)) return { ok: false, msg: 'The storm would devour the blessing — this sky is cursed.' };
    if (w.blessAt(x, y)) return { ok: false, msg: 'This land already carries your favor.' };
    w.blesses.push({ x, y, r: 5, start: w.tick });

      const slowEnough = app.speed <= 6;
      if (e.imp >= 3 || (e.imp === 2 && slowEnough && !app.paused)) {
        if (e.x !== undefined) S.effects.addPing(e.x, e.y, e.tone);
      }
      if (e.fx !== undefined && e.x !== undefined && (slowEnough || e.imp >= 3)) {
        S.effects.addArrow(e.fx, e.fy, e.x, e.y, e.tone === 'doom' ? 'doom' : 'ink');
      }
    };
    // Backfill chronicle panel with founding events.
    for (const e of w.chronicle.events) S.ui.addEntry(app, e);
    app.renderer.setWorld(w);
    S.ui.setDate(app);
  }

  function newWorld(seed) {
    document.getElementById('chron-entries').innerHTML = '';
    boot(seed);
    S.ui.toast(app, 'A new world · seed ' + seed);
  }

  // --- fixed-step sim scheduler ---
  let acc = 0;
  function simStep(dt) {
    if (app.paused) return;
    acc += dt * app.speed * 12; // ticks (months) per second
    let n = Math.min(60, Math.floor(acc));
    acc -= Math.floor(acc);
    while (n-- > 0) S.sim.tick(app.world);
  }

  // --- input ---
  function wireInput(canvas) {
    const cam = () => app.renderer.cam;
    let dragging = false, moved = 0, lastX = 0, lastY = 0;
    const pointers = new Map();
    let pinchDist = 0;

    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinchDist = Math.hypot(a[0] - b[0], a[1] - b[1]);
      }
      dragging = true; moved = 0;
      lastX = e.clientX; lastY = e.clientY;
    });
    canvas.addEventListener('pointermove', (e) => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinchDist > 0) {
          cam().zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinchDist);
        }
        pinchDist = d;
        moved = 99;
        return;
      }
      if (dragging) {
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        moved += Math.abs(dx) + Math.abs(dy);
        cam().panBy(dx, dy);
        lastX = e.clientX; lastY = e.clientY;
        S.ui.tooltip(app, null);
      } else {
        hover(e.clientX, e.clientY);
      }
    });
    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchDist = 0;
      if (dragging && moved < 5) click(e.clientX, e.clientY);
      dragging = pointers.size > 0;
    };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', () => S.ui.tooltip(app, null));
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      cam().zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0014));
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); togglePause(); }
      else if (e.key === '1' || e.key === '2' || e.key === '3') setSpeed([1, 6, 24][+e.key - 1]);
      else if (e.key === 'i') S.ui.setPower(app, 'inspect');
      else if (e.key === 'g') S.ui.setPower(app, 'gold');
      else if (e.key === 'c') S.ui.setPower(app, 'curse');
      else if (e.key === 'b') S.ui.setPower(app, 'bless');
    });
  }

  function worldCell(px, py) {
    const [wx, wy] = app.renderer.cam.screenToWorld(px, py);
    return [wx / CS - 0.5, wy / CS - 0.5];
  }

  function click(px, py) {
    const [cx, cy] = worldCell(px, py);
    const w = app.world;
    if (app.power === 'inspect') {
      const s = w.settlementNear(Math.round(cx), Math.round(cy), 2);
      if (s) S.effects.addPing(s.x, s.y, 'ink');
      return;
    }
    const fn = app.power === 'gold' ? S.powers.seedGold
      : app.power === 'curse' ? S.powers.curseWeather
      : S.powers.blessLand;
    const res = fn(w, cx, cy);
    if (!res.ok) {
      S.ui.toast(app, res.msg, 'doom');
    } else {
      S.effects.addPing(res.x, res.y, app.power === 'curse' ? 'doom' : 'god');
      if (app.paused) togglePause(); // an act of god sets time moving
    }
  }

  function hover(px, py) {
    const w = app.world;
    if (!w) return;
    const [fx, fy] = worldCell(px, py);
    const x = Math.round(fx), y = Math.round(fy);
    if (!w.inB(x, y)) { S.ui.tooltip(app, null); return; }
    const P = S.palette;
    const s = w.settlementNear(x, y, 1.6);
    if (s) {
      const c = S.CULTURES[s.culture];
      const flags = [];
      if (s.gold) flags.push('<em class="f-gold">gold-blessed</em>');
      if (w.stormAt(s.x, s.y)) flags.push('<em class="f-doom">storm-cursed</em>');
      if (w.blessAt(s.x, s.y)) flags.push('<em class="f-god">favored</em>');
      for (const d of w.dragons) {
        if ((s.x - d.x) ** 2 + (s.y - d.y) ** 2 <= 64) { flags.push('<em class="f-doom">in the wyrm’s shadow</em>'); break; }
      }
      S.ui.tooltip(app,
        `<h3>${s.name}</h3>
         <p>${w.tierName(s.tier)} of the ${c.name} · pop ~${Math.round(s.pop / 10) * 10}</p>
         <p>founded Year ${s.foundedYear}${flags.length ? ' · ' + flags.join(' · ') : ''}</p>`,
        px, py);
      return;
    }
    for (const r of w.ruins) {
      if ((r.x - x) ** 2 + (r.y - y) ** 2 <= 2.6) {
        S.ui.tooltip(app, `<h3>${r.alt || 'Ruins of ' + r.name}</h3>
          <p>${r.alt ? 'once ' + r.name + ' · ' : ''}abandoned Year ${r.year}${r.cause === 'dragon' ? ' · dragonfire' : r.cause === 'storm' ? ' · the endless storm' : ''}</p>`, px, py);
        return;
      }
    }
    for (const d of w.dragons) {
      if ((d.x - x) ** 2 + (d.y - y) ** 2 <= 2.6) {
        S.ui.tooltip(app, `<h3>${d.name}</h3><p>nested here since Year ${d.bornYear}</p>`, px, py);
        return;
      }
    }
    const i = w.idx(x, y);
    const biome = P.BIOME_NAMES[w.biome[i]];
    const region = w.regionOf[i] >= 0 ? w.regions[w.regionOf[i]].name : null;
    const vein = w.goldVeinNear(x, y, 1.5, true);
    let extra = '';
    if (vein) extra = '<p><em class="f-gold">a gold vein glitters here</em></p>';
    else if (w.stormAt(x, y)) extra = '<p><em class="f-doom">cursed skies</em></p>';
    else if (w.blessAt(x, y)) extra = '<p><em class="f-god">blessed ground</em></p>';
    else if (w.isLandAt(x, y)) {
      const f = w.fert[i];
      extra = `<p>${f > 0.8 ? 'rich soil' : f > 0.45 ? 'fair soil' : 'thin soil'}</p>`;
    }
    S.ui.tooltip(app, `<h3>${region || (w.isLandAt(x, y) ? 'Open country' : 'Open water')}</h3><p>${biome}</p>${extra}`, px, py);
  }

  function togglePause() {
    app.paused = !app.paused;
    S.ui.updatePauseButton(app);
  }
  function setSpeed(v) {
    app.speed = v;
    document.querySelectorAll('#timectl .speed').forEach((b) => {
      b.classList.toggle('active', +b.dataset.speed === v);
    });
    if (app.paused) togglePause();
  }

  // --- fast-forward for screenshots / sharing (?run=400) ---
  function autorun(years, done) {
    const w = app.world;
    const overlay = document.createElement('div');
    overlay.id = 'ffwd';
    overlay.textContent = 'The chronicle is being written…';
    document.getElementById('app').appendChild(overlay);
    const target = years;
    (function chunk() {
      const step = Math.min(25, target - w.year);
      S.sim.runYears(w, step);
      overlay.textContent = `The chronicle is being written… Year ${w.year}`;
      S.ui.setDate(app);
      if (w.year < target) requestAnimationFrame(chunk);
      else { overlay.remove(); done(); }
    })();
  }

  function start() {
    const q = params();
    const canvas = document.getElementById('map');
    app.renderer = S.renderer.create(canvas, { W: 192, H: 120 });
    S.ui.build(app);
    wireInput(canvas);
    window.addEventListener('resize', () => app.renderer.resize());

    const seed = q.seed !== null ? q.seed : (Math.random() * 100000 | 0);
    boot(seed);

    // Intro wiring.
    const intro = document.getElementById('intro');
    const seedInput = document.getElementById('intro-seed');
    seedInput.value = seed;
    document.getElementById('intro-reroll').addEventListener('click', () => {
      seedInput.value = Math.random() * 100000 | 0;
    });
    const dismiss = (watch) => {
      const sv = seedInput.value.trim();
      if (sv && String(app.world.seed) !== sv) newWorld(sv);
      intro.remove();
      setSpeed(watch ? 24 : 1);
    };
    document.getElementById('btn-watch').addEventListener('click', () => dismiss(true));
    document.getElementById('btn-shape').addEventListener('click', () => dismiss(false));

    document.getElementById('btn-pause').addEventListener('click', togglePause);
    document.querySelectorAll('#timectl .speed').forEach((b) => {
      b.addEventListener('click', () => setSpeed(+b.dataset.speed));
    });
    document.getElementById('btn-new').addEventListener('click', () => {
      newWorld(Math.random() * 100000 | 0);
    });

    if (q.nointro) intro.remove();
    if (q.speed) setSpeed(q.speed);

    // Main loop.
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      simStep(dt);
      if (app.world.tick !== app._shownTick) {
        app._shownTick = app.world.tick;
        S.ui.setDate(app);
      }
      app.renderer.draw(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    if (q.run > 0) {
      autorun(q.run, () => {
        app.paused = true;
        S.ui.updatePauseButton(app);
        requestAnimationFrame(() => requestAnimationFrame(() => { window.__slateReady = true; }));
      });
    } else {
      window.__slateReady = true;
    }
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  }
})(typeof SLATE !== 'undefined' ? SLATE : (globalThis.SLATE = {}));

</script>
</body>
</html>
